# Log rotation for the department server (V2 guide 11.1).
# Install: sudo cp deploy/logrotate.conf /etc/logrotate.d/imreport

/opt/imreport/backend/storage/logs/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

/var/log/imreport-queue.log /var/log/imreport-backup.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
