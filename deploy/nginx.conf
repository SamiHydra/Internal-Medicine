# nginx site for the department server (V2 guide 11.1). SAME ORIGIN: nginx
# serves the built SPA and proxies /api (plus Sanctum's cookie endpoints) to
# PHP-FPM, which collapses the old cross-site setup - SANCTUM_STATEFUL_DOMAINS
# and SESSION_DOMAIN become this one hostname and CORS goes away.
#
# Install: /etc/nginx/sites-available/imreport, symlink into sites-enabled,
# then: nginx -t && systemctl reload nginx
#
# HEADERS - READ BEFORE EDITING.
# The SPA document is served from disk by nginx; Laravel's SecurityHeaders
# middleware never sees it, so CSP/HSTS/Permissions-Policy have to be set here
# or the HTML shell (the only response that can execute script) ships without
# them. The policy below is the same one public/_headers and public/.htaccess
# already carry, so every way this bundle can be hosted enforces one policy.
#
# Verified in a real browser (headless Chromium) against the parity lane, not
# just by header presence: sign-in succeeds, /admin/users, /admin/reports,
# /admin/notifications, /admin/settings and /admin/templates all render, the
# workspace switcher works, and a Radix combobox opens with its options and its
# scroll-lock (body overflow: hidden). That overlay injects 2 <style> elements
# at runtime, which is exactly why style-src needs 'unsafe-inline' - dropping it
# breaks every dialog, select and popover. Console CSP violations across all of
# that: zero.
#
# There is no 'unsafe-eval' and nothing in the bundle needs it: grep for
# `new Function` / `Function("")` across all 79 built assets returns nothing.
# If a future dependency does start probing eval, do NOT relax the policy to
# silence the report - it would give back the whole class of injection this
# policy exists to stop.
#
# nginx's add_header is REPLACE, not merge: a location that declares any
# add_header of its own inherits none from the server level. That silently
# stripped nosniff from /assets/ and /sw.js when they set their own
# Cache-Control. The fix is the $imreport_cache_control map below - per-URI
# caching without a single location-level add_header, so the header set lives
# in exactly one place. Do not reintroduce `expires` or an add_header inside
# location /assets/ or location = /sw.js.

# Empty map values are skipped by add_header, so only /assets/ and /sw.js get a
# Cache-Control from nginx; /api responses keep Laravel's own untouched.
map $uri $imreport_cache_control {
    default     "";
    ~^/assets/  "public, max-age=2592000, immutable";
    ~^/sw\.js$  "no-cache";
}

# Laravel already sends its own (stricter, JSON-shaped) CSP on /api and
# /sanctum. Emitting this one there too would put two DIFFERENT policies on one
# response, which is the header conflict this file is meant to remove, so the
# document policy is suppressed on the paths Laravel serves. Every other header
# below is byte-identical to SecurityHeaders.php, so a duplicate there is inert.
# Keyed on $request_uri, NOT $uri: the Laravel locations rewrite $uri to
# /laravel-index.php via try_files, and map variables are evaluated in the
# header filter, i.e. AFTER that internal redirect. $request_uri keeps the
# client's original path, so the suppression actually fires.
map $request_uri $imreport_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    ~^/(api|sanctum)/ "";
}

server {
    listen 80;
    server_name im.hospital.internal;

    # Everything moves to HTTPS: the PWA service worker requires it even on a LAN.
    return 301 https://$host$request_uri;
}

server {
    # Keep the `listen ... http2` form: the standalone `http2 on;` directive only
    # exists from nginx 1.25.1, and every current Ubuntu LTS ships older (22.04:
    # 1.18, 24.04: 1.24), where it is a hard `unknown directive` parse error. The
    # old form still works on 1.25+ (deprecation warning only).
    listen 443 ssl http2;
    server_name im.hospital.internal;

    # Use an internal CA for the .internal hostname. If Hospital IT provides a
    # real private-DNS name, these paths may instead point to DNS-01 ACME files.
    ssl_certificate     /etc/imreport/tls/fullchain.pem;
    ssl_certificate_key /etc/imreport/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The built SPA.
    root /opt/imreport/current/dist;
    index index.html;

    # Hardening headers. Referrer-Policy matches SecurityHeaders.php so the two
    # values a browser sees on an /api response agree instead of contradicting.
    # HSTS belongs only in this block: on the port-80 redirect above it would be
    # ignored by browsers anyway.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy $imreport_csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $imreport_cache_control always;

    client_max_body_size 20m;

    # Compress the large JSON workspace/analytics responses and text assets.
    # Vary keeps shared caches from mixing encoded and identity responses.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # Laravel: API, Sanctum cookie endpoints, and the queue-safe health path.
    # Liveness probe for external monitors and deploy.sh: Laravel's /up answers
    # 200 only when the framework boots. Without this block the SPA fallback
    # answered every /up with index.html, so a broken backend looked healthy
    # (QA-020). No add_header here: the server-level security headers apply.
    location = /up {
        try_files $uri /laravel-index.php$is_args$args;
    }

    location ~ ^/(api|sanctum)/ {
        try_files $uri /laravel-index.php$is_args$args;
    }

    location = /laravel-index.php {
        internal;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /opt/imreport/current/backend/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 60s;
    }

    # Long-cache immutable build assets (Vite hashes filenames). Cache-Control
    # comes from the map; adding one here would strip the security headers.
    location /assets/ {
        try_files $uri =404;
    }

    # The service worker must never be cached aggressively (map: no-cache).
    location = /sw.js {
        try_files $uri =404;
    }

    # SPA fallback: every other route is the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
