# nginx site for the department server (V2 guide 11.1). SAME ORIGIN: nginx
# serves the built SPA and proxies /api (plus Sanctum's cookie endpoints) to
# PHP-FPM, which collapses the old cross-site setup - SANCTUM_STATEFUL_DOMAINS
# and SESSION_DOMAIN become this one hostname and CORS goes away.
#
# Install: /etc/nginx/sites-available/imreport, symlink into sites-enabled,
# then: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name im.hospital.internal;

    # Everything moves to HTTPS: the PWA service worker requires it even on a LAN.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name im.hospital.internal;

    ssl_certificate     /etc/letsencrypt/live/im.hospital.internal/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/im.hospital.internal/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The built SPA.
    root /var/www/imreport;
    index index.html;

    # Hardening headers (the app also sets its own via middleware).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 20m;

    # Laravel: API, Sanctum cookie endpoints, and the queue-safe health path.
    location ~ ^/(api|sanctum)/ {
        try_files $uri /laravel-index.php$is_args$args;
    }

    location = /laravel-index.php {
        internal;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /opt/imreport/backend/public/index.php;
        fastcgi_param HTTPS on;
    }

    # Long-cache immutable build assets (Vite hashes filenames).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker must never be cached aggressively.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: every other route is the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
