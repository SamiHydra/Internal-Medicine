; Production PHP-FPM pool overrides for /etc/php/8.3/fpm/pool.d/imreport.conf.
; Start with these conservative limits, then size pm.max_children from measured
; peak worker RSS: floor((RAM reserved for PHP) / p95 worker RSS). Never raise it
; beyond the MariaDB connection budget.

[imreport]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

request_terminate_timeout = 60s
request_slowlog_timeout = 3s
slowlog = /var/log/php8.3-fpm-imreport-slow.log

; Explicit rather than inherited. Without this the pool runs on PHP's 128 MB
; default, which the analytics dashboard once exhausted outright on a full-year
; range; it now peaks around 26 MB there, so this is headroom for the archive
; growing, not for a known regression. Budget it against pm.max_children above:
; a saturated pool can want up to max_children x this much RAM.
php_admin_value[memory_limit] = 256M

; Upload limits (QA-005). The application accepts evidence and import files up
; to 10 MB (App\Support\Uploads::MAX_FILE_KILOBYTES) and deploy/nginx.conf allows
; client_max_body_size 20m, but PHP's own defaults are 2M / 8M, which turned
; every 2 to 10 MB upload into a bare "The file failed to upload." The pool
; therefore states both limits explicitly: upload_max_filesize covers the file
; plus multipart overhead, post_max_size covers the whole request body.
; app:launch-readiness reads this file and fails when either value is missing.
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 20M

; Exposes queue depth/worker saturation on the local socket. Keep the Nginx
; status location restricted to localhost if it is enabled for monitoring.
pm.status_path = /fpm-status
ping.path = /fpm-ping

catch_workers_output = yes
decorate_workers_output = no
