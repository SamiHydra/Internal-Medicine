# Production-parity stack for security / performance / scalability auditing.
#
# WHY: the local dev lane is SQLite (single-writer), so lock contention,
# connection limits, real query plans, index effectiveness, security headers and
# HTTPS cookie flags cannot be measured there. This stack is the MariaDB + nginx
# + PHP-FPM lane those measurements need.
#
# It mirrors deploy/README.md, deploy/deploy.sh, deploy/nginx.conf and
# deploy/queue-worker.service. See docker/README.md for the full gap list.
#
# It NEVER touches backend/.env or the dev SQLite database, and it does not bind
# :5173 or :8000.
#
#   docker compose up -d --build          start the stack
#   docker compose --profile test run --rm test    MariaDB test lane
#
name: imreport-parity

x-php-image: &php-image
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: app
    args:
      PHP_VERSION: "8.3"
      VITE_API_BASE_URL: "https://localhost:8443"
  image: imreport-parity/app:local
  env_file:
    - .env.docker
  volumes:
    - app-storage:/opt/imreport/current/backend/storage
  networks:
    - imreport

services:
  # ------------------------------------------------------------------ db ---
  # MariaDB 11.4 LTS - the version .github/workflows/ci.yml already pins for
  # the backend-mariadb job.
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: imreport
      MARIADB_USER: imreport
      MARIADB_PASSWORD: local-parity-stack
      MARIADB_ROOT_PASSWORD: local-parity-stack-root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Deliberately audit-friendly: a real connection ceiling to saturate, and
      # slow-query capture so index effectiveness is observable.
      - --max-connections=151
      - --slow-query-log=1
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=0.5
      - --log-queries-not-using-indexes=1
      - --innodb-buffer-pool-size=256M
      - --performance-schema=ON
    volumes:
      - db-data:/var/lib/mysql
    ports:
      # Exposed so the auditor can run EXPLAIN / SHOW ENGINE INNODB STATUS from
      # the host. 33306 avoids clashing with any local MySQL on 3306.
      - "127.0.0.1:33306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - imreport

  # ----------------------------------------------------------------- app ---
  # PHP-FPM. Owns migrations, seeding and the config/route/view caches, then
  # serves FastCGI on 9000. Nothing else in the stack starts until it is healthy.
  app:
    <<: *php-image
    restart: unless-stopped
    environment:
      STACK_ROLE: app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Healthy == php-fpm is accepting FastCGI, which only happens after
      # migrate + seed + the cache build have completed in the entrypoint.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 180s

  # ----------------------------------------------------------------- web ---
  # nginx: serves the BUILT SPA (npm run build) and proxies /api + /sanctum to
  # PHP-FPM from the same origin. Not Vite.
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        VITE_API_BASE_URL: "https://localhost:8443"
    image: imreport-parity/web:local
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"    # 301 -> https://localhost:8443, as production does
      - "127.0.0.1:8443:443"   # the real vhost (self-signed certificate)
    healthcheck:
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://127.0.0.1/index.html"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - imreport

  # --------------------------------------------------------------- queue ---
  # deploy/queue-worker.service, containerised. Same flags, same restart policy.
  queue:
    <<: *php-image
    restart: unless-stopped
    environment:
      STACK_ROLE: worker
    depends_on:
      app:
        condition: service_healthy
    # Same queues as deploy/queue-worker.service: analytics exports are
    # dispatched to the `analytics` queue, so a worker on `default` alone left
    # every export pending (found during the 2026-09 release validation).
    command:
      ["php", "artisan", "queue:work", "--queue=analytics,default", "--tries=3", "--backoff=10", "--max-time=3600"]

  # deploy/queue-notifications-worker.service, containerised: mail, SMS and
  # digest deliveries run on their own worker so a slow gateway never blocks
  # the analytics worker.
  queue-notifications:
    <<: *php-image
    restart: unless-stopped
    environment:
      STACK_ROLE: worker
    depends_on:
      app:
        condition: service_healthy
    command:
      ["php", "artisan", "queue:work", "--queue=notifications,default", "--tries=3", "--backoff=10", "--max-time=3600"]

  # ----------------------------------------------------------- scheduler ---
  # The department server runs `php artisan schedule:run` from cron every
  # minute (deploy/README.md step 9). schedule:work is the same tick without a
  # cron daemon in the container.
  scheduler:
    <<: *php-image
    restart: unless-stopped
    environment:
      STACK_ROLE: worker
    depends_on:
      app:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]

  # -------------------------------------------------- MariaDB test lane ----
  # Separate server: the test suite uses RefreshDatabase, which runs
  # migrate:fresh and would DROP every table in the parity database.
  testdb:
    profiles: ["test"]
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: mesay_test
      MARIADB_USER: mesay
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: secret-root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=151
    tmpfs:
      # Throwaway data, and a tmpfs datadir keeps migrate:fresh fast.
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - imreport

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: test
      args:
        PHP_VERSION: "8.3"
    image: imreport-parity/test:local
    depends_on:
      testdb:
        condition: service_healthy
    # backend/phpunit.mariadb.xml pins DB_HOST=127.0.0.1 with force="true", so
    # the only way to reach a containerised MariaDB without editing application
    # files is to share testdb's network namespace.
    network_mode: "service:testdb"

volumes:
  db-data:
  app-storage:

networks:
  imreport:
    driver: bridge
