map $uri $audit_cache_control {
    default "";
    ~^/assets/ "public, max-age=2592000, immutable";
    ~^/sw\.js$ "no-cache";
}

server {
    listen 80;
    server_name localhost;
    return 301 https://localhost:18443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate /etc/imreport/tls/fullchain.pem;
    ssl_certificate_key /etc/imreport/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/imreport/current/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $audit_cache_control always;

    client_max_body_size 20m;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript application/manifest+json
      application/xml image/svg+xml text/css text/plain text/xml;

    location ~ ^/(api|sanctum)/ {
        try_files $uri /laravel-index.php$is_args$args;
    }

    location = /laravel-index.php {
        internal;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /opt/imreport/current/backend/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 120s;
    }

    location = /fpm-status {
        include fastcgi_params;
        fastcgi_pass app:9001;
        fastcgi_param SCRIPT_FILENAME "";
    }

    location = /fpm-ping {
        include fastcgi_params;
        fastcgi_pass app:9001;
        fastcgi_param SCRIPT_FILENAME "";
    }

    location = /audit-measure.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /audit/measure-endpoint.php;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 180s;
    }

    location /assets/ { try_files $uri =404; }
    location = /sw.js { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
