# Container adaptation of deploy/nginx.conf.
#
# Same shape as the department server: SAME ORIGIN - nginx serves the built SPA
# and proxies /api and /sanctum to PHP-FPM, so Sanctum's cookie auth works
# without CORS.
#
# Differences from deploy/nginx.conf, all forced by containerisation:
#   * fastcgi_pass app:9000 instead of unix:/run/php/php8.3-fpm.sock
#   * a self-signed certificate instead of the Hospital IT internal CA
#   * server_name localhost, and the HTTP->HTTPS redirect targets the published
#     host port 8443 (compose maps 8080->80 and 8443->443)
#
# The header block and the $imreport_cache_control map are deliberately
# IDENTICAL to deploy/nginx.conf - this lane exists to observe the real server's
# headers, so any divergence makes the observation worthless. See the long note
# in deploy/nginx.conf for why the map replaces location-level add_header.

map $uri $imreport_cache_control {
    default     "";
    ~^/assets/  "public, max-age=2592000, immutable";
    ~^/sw\.js$  "no-cache";
}

# Keyed on $request_uri, NOT $uri: the Laravel locations rewrite $uri to
# /laravel-index.php via try_files, and map variables are evaluated in the
# header filter, i.e. AFTER that internal redirect. $request_uri keeps the
# client's original path, so the suppression actually fires.
map $request_uri $imreport_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    ~^/(api|sanctum)/ "";
}

server {
    listen 80;
    server_name localhost;

    # Everything moves to HTTPS: the PWA service worker requires it even on a LAN.
    # The published HTTPS port is 8443, so the redirect names it explicitly.
    return 301 https://localhost:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/imreport/tls/fullchain.pem;
    ssl_certificate_key /etc/imreport/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The built SPA.
    root /opt/imreport/current/dist;
    index index.html;

    # Hardening headers. Referrer-Policy matches SecurityHeaders.php so the two
    # values a browser sees on an /api response agree instead of contradicting.
    # HSTS belongs only in this block: on the port-80 redirect above it would be
    # ignored by browsers anyway.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy $imreport_csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $imreport_cache_control always;

    client_max_body_size 20m;

    # Laravel: API, Sanctum cookie endpoints, and the queue-safe health path.
    location ~ ^/(api|sanctum)/ {
        try_files $uri /laravel-index.php$is_args$args;
    }

    location = /laravel-index.php {
        internal;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /opt/imreport/current/backend/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120s;
    }

    # Long-cache immutable build assets (Vite hashes filenames). Cache-Control
    # comes from the map; adding one here would strip the security headers.
    location /assets/ {
        try_files $uri =404;
    }

    # The service worker must never be cached aggressively (map: no-cache).
    location = /sw.js {
        try_files $uri =404;
    }

    # SPA fallback: every other route is the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
