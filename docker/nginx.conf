# Container adaptation of deploy/nginx.conf.
#
# Same shape as the department server: SAME ORIGIN - nginx serves the built SPA
# and proxies /api and /sanctum to PHP-FPM, so Sanctum's cookie auth works
# without CORS.
#
# Differences from deploy/nginx.conf, all forced by containerisation:
#   * fastcgi_pass app:9000 instead of unix:/run/php/php8.3-fpm.sock
#   * a self-signed certificate instead of the Hospital IT internal CA
#   * server_name localhost, and the HTTP->HTTPS redirect targets the published
#     host port 8443 (compose maps 8080->80 and 8443->443)

server {
    listen 80;
    server_name localhost;

    # Everything moves to HTTPS: the PWA service worker requires it even on a LAN.
    # The published HTTPS port is 8443, so the redirect names it explicitly.
    return 301 https://localhost:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/imreport/tls/fullchain.pem;
    ssl_certificate_key /etc/imreport/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The built SPA.
    root /opt/imreport/current/dist;
    index index.html;

    # Hardening headers (the app also sets its own via middleware).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 20m;

    # Laravel: API, Sanctum cookie endpoints, and the queue-safe health path.
    location ~ ^/(api|sanctum)/ {
        try_files $uri /laravel-index.php$is_args$args;
    }

    location = /laravel-index.php {
        internal;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /opt/imreport/current/backend/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120s;
    }

    # Long-cache immutable build assets (Vite hashes filenames).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker must never be cached aggressively.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: every other route is the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
