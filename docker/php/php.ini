; Production-shaped PHP settings for the parity stack.
; The point of this file is that performance and error-handling behaviour match
; a real deployment: opcache on, no display_errors, realistic limits.

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

expose_php = Off

memory_limit = 256M
max_execution_time = 60

; deploy/nginx.conf sets client_max_body_size 20m; keep PHP consistent.
upload_max_filesize = 20M
post_max_size = 21M

date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Immutable release directories in production mean the file cache never needs
; revalidation. Same here: the code is baked into the image.
opcache.validate_timestamps = 0
opcache.save_comments = 1
