; PHP-FPM pool overrides for the parity stack.
;
; Production uses a unix socket (deploy/nginx.conf:
; fastcgi_pass unix:/run/php/php8.3-fpm.sock). Containers cannot share that
; socket across service boundaries, so this pool listens on TCP 9000. That is
; the one deliberate transport difference; everything else (process manager,
; child limits, slow log) is production-shaped.

[www]
listen = 0.0.0.0:9000

user = www-data
group = www-data

; clear_env defaults to "yes", which would strip every variable compose injects
; and leave Laravel with no DB credentials before config:cache exists.
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Surface requests that block - the whole reason this lane exists is to make
; lock contention and slow queries visible.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s

catch_workers_output = yes
decorate_workers_output = no

pm.status_path = /fpm-status
ping.path = /fpm-ping
