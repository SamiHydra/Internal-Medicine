name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test:run

      - name: Build frontend
        run: npm run build

      - name: Enforce frontend performance budget
        run: npm run perf:budget

  backend-sqlite:
    name: Backend SQLite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, fileinfo, mbstring, pdo_sqlite
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit backend dependencies
        run: composer audit --no-interaction

      - name: Check backend formatting
        run: vendor/bin/pint --test

      - name: Test backend with SQLite
        run: php artisan test

  lighthouse:
    name: Mobile Lighthouse budgets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, fileinfo, mbstring, pdo_sqlite
          coverage: none

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build production frontend
        env:
          VITE_API_BASE_URL: http://localhost:4173
          VITE_RELEASE_SHA: ${{ github.sha }}
          VITE_RUM_SAMPLE_RATE: '0'
        run: npm run build

      - name: Enforce login and authenticated-shell budgets
        run: |
          node scripts/start-e2e-backend.mjs > "$RUNNER_TEMP/lighthouse-backend.log" 2>&1 &
          backend_pid=$!
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/lighthouse-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" "$backend_pid" 2>/dev/null || true' EXIT
          for attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:8000/up >/dev/null &&
               curl --fail --silent http://localhost:4173/login >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              cat "$RUNNER_TEMP/lighthouse-backend.log"
              cat "$RUNNER_TEMP/lighthouse-preview.log"
              exit 1
            fi
            sleep 1
          done
          npm run perf:lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore

  backend-mariadb:
    name: Backend MariaDB
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_DATABASE: mesay_test
          MYSQL_USER: mesay
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -umesay -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, fileinfo, mbstring, pdo_mysql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Test backend with MariaDB
        run: vendor/bin/phpunit --configuration phpunit.mariadb.xml

  deployment-scripts:
    name: Deployment shell scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Check shell syntax
        run: bash -n deploy/*.sh

      - name: Lint deployment scripts
        run: shellcheck deploy/*.sh

  e2e:
    name: Isolated Playwright gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, fileinfo, mbstring, pdo_sqlite
          coverage: none

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run isolated browser suite
        run: npm run test:e2e
